# Build step 2's proof driver: a real Spark 4.1.3 driver (local mode), started by hand, whose UI the
# backend proxies through a real core. Step 3 replaces it with drivers the module starts itself.
# Test fixture only.
#
# The image is the pinned Spark runtime base
# (apache/spark:4.1.3-scala2.13-java21-python3-ubuntu@sha256:bf9d035a7c32a8ca46aa58d6348182ffd7d2dff6409206ecfbb3915ff1fef211,
# docs/design-v0.md item 1). The Integration job pulls it by that digest on the runner (with its
# Docker Hub login) and loads it into kind as __SPARK_IMAGE__, so the kind node never pulls from
# Docker Hub anonymously.
#
# The Spark UI settings are internal/sparkconf's UIConf and UIEnv exactly
# (test/contract checks this file against them), with the run id proof-1.
apiVersion: v1
kind: Namespace
metadata:
  name: booth-spark-proof
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: proof-app
  namespace: booth-spark-proof
data:
  proof.py: |
    # A few jobs (one with a description, so the jobs page has something recognisable), a SQL query
    # (so the SQL tab has one), then the driver stays up so its UI can be browsed.
    import time
    from pyspark.sql import SparkSession
    spark = SparkSession.builder.appName("booth-spark-ui-proof").getOrCreate()
    sc = spark.sparkContext
    sc.setJobDescription("booth proof job")
    print("sum", sc.parallelize(range(100000), 4).map(lambda x: x * x).sum(), flush=True)
    sc.setJobDescription(None)
    spark.range(1000).selectExpr("id % 7 as k").groupBy("k").count().collect()
    print("PROOF-READY", flush=True)
    time.sleep(7200)
---
apiVersion: v1
kind: Pod
metadata:
  name: proof-driver
  namespace: booth-spark-proof
  labels: {app: proof-driver}
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 185
    runAsGroup: 185
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: driver
      image: __SPARK_IMAGE__
      imagePullPolicy: Never
      args:
        - /opt/spark/bin/spark-submit
        - --master
        - local[2]
        - --conf
        - spark.redaction.regex=(?i)secret|password|token|access[.]?key|bearer|credential
        - --conf
        - spark.ui.heapHistogramEnabled=false
        - --conf
        - spark.ui.killEnabled=false
        - --conf
        - spark.ui.threadDumpsEnabled=false
        # Not a real secret: proves the Environment page redacts what the regex names.
        - --conf
        - spark.booth.proof.token=proof-value-must-not-appear
        - /proof/proof.py
      env:
        - name: APPLICATION_WEB_PROXY_BASE
          value: /iframe/spark/runs/proof-1/ui
      ports:
        - {name: ui, containerPort: 4040}
      readinessProbe:
        httpGet: {path: /jobs/, port: ui}
        periodSeconds: 3
        failureThreshold: 100
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: ["ALL"]}
      resources:
        requests: {cpu: 250m, memory: 896Mi}
        limits: {cpu: "1", memory: 1Gi}
      volumeMounts:
        - {name: app, mountPath: /proof, readOnly: true}
        - {name: tmp, mountPath: /tmp}
        - {name: work, mountPath: /opt/spark/work-dir}
  volumes:
    - name: app
      configMap: {name: proof-app}
    - name: tmp
      emptyDir: {sizeLimit: 512Mi}
    - name: work
      emptyDir: {sizeLimit: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: proof-driver
  namespace: booth-spark-proof
spec:
  selector: {app: proof-driver}
  ports:
    - {name: ui, port: 4040, targetPort: ui}
