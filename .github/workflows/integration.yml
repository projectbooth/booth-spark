name: Integration

# Layer 3 (contracts/testing-strategy.md, ADR 0024): real-cluster integration tests on kind. Runs on
# merge to main, nightly, by hand, and on pull requests: ADR 0110 merges each build step only with a
# green Integration run on its PR's exact head SHA, and a pull_request run is that run (a
# workflow_dispatch can't target a PR before the workflow exists on main). See
# test/integration/README.md for what each job covers and what it does not.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "20 8 * * *" # nightly
  workflow_dispatch: {}

permissions:
  contents: read

# kind and its node image are pinned (docs/design-v0.md item 9): kind v0.33.0's own release notes
# list this digest for Kubernetes 1.35.8, which serves ValidatingAdmissionPolicy (GA in 1.30; the
# chart refuses a cluster that doesn't, and verify.sh checks it is served). kind's default CNI
# (kindnet) enforces NetworkPolicy ingress but NOT egress (measured, step 3), so the real-core job,
# whose isolation and egress checks depend on egress rules, runs kind without it and installs
# Calico (test/integration/cni/).
env:
  KIND_VERSION: v0.33.0
  KIND_NODE_IMAGE: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0

jobs:
  standins:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Authenticated pulls get a much higher Docker Hub rate limit than anonymous ones -- docker
      # build and kind's own node image both pull from docker.io. Guarded so forks and Dependabot
      # (neither receives these org secrets) are skipped rather than failing. Copied from booth-core
      # (its PR #11).
      - uses: docker/login-action@v3
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: helm/kind-action@v1
        with:
          version: ${{ env.KIND_VERSION }}
          node_image: ${{ env.KIND_NODE_IMAGE }}
          cluster_name: booth-spark-ci

      - uses: azure/setup-helm@v4

      - name: Build and load the booth-spark image
        run: |
          docker build -t booth-spark:ci .
          kind load docker-image booth-spark:ci --name booth-spark-ci

      - name: Deploy with a stand-in PostgreSQL and booth-core's CRD
        run: test/integration/deploy-standins.sh booth-spark:ci

      - name: Verify
        run: test/integration/verify.sh

      - name: Dump state on failure
        if: failure()
        run: |
          kubectl -n booth-spark get all
          kubectl -n booth-spark describe pods | tail -60
          kubectl -n booth-spark logs deployment/booth-spark --tail=200 || true

  real-core:
    # The install path a user actually takes: a real Keycloak and a real booth-core, which provisions
    # the database from this chart's BoothModule, signs the iframe assertion and mints workload
    # tokens. booth-core is built at a pinned commit, not its moving master
    # (contracts/testing-strategy.md); bump CORE_REF deliberately, together with
    # test/integration/fixtures/boothmodule-crd.yaml (vendored from the same commit).
    #   CORE_REF f631bd2: booth-core master, 2026-10-09 (bundled Keycloak and Ingress merged; both off
    #   here, as core's own kind-deploy runs them)
    runs-on: ubuntu-24.04
    env:
      CORE_REF: f631bd2cde1991492676649945dac226a7410f90
      # The Spark runtime image of every run (docs/design-v0.md item 1, runs.image): the pinned
      # multi-arch index, and its linux/amd64 manifest, which is what gets pulled and loaded. `kind
      # load` can't import a multi-arch index whose other platforms aren't present locally ("content
      # digest ... not found"), so the job loads the single-platform manifest and first checks that it
      # really is the pinned index's amd64 entry. Pulled on the runner (logged in), so the kind node
      # never pulls from Docker Hub.
      SPARK_INDEX: apache/spark:4.1.3-scala2.13-java21-python3-ubuntu@sha256:bf9d035a7c32a8ca46aa58d6348182ffd7d2dff6409206ecfbb3915ff1fef211
      SPARK_IMAGE_AMD64: apache/spark@sha256:7cdb42ed55b5e02c279e838e38da3336dae74dca6aef07defae93f3c197d8ed6
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: projectbooth/booth-core
          ref: ${{ env.CORE_REF }}
          path: booth-core

      - uses: helm/kind-action@v1
        with:
          version: ${{ env.KIND_VERSION }}
          node_image: ${{ env.KIND_NODE_IMAGE }}
          cluster_name: booth-spark-realcore
          config: test/integration/cni/kind-calico.yaml

      - name: Calico (pinned manifest and image digests), for NetworkPolicy egress enforcement
        run: test/integration/cni/calico.sh

      - uses: azure/setup-helm@v4

      - name: The vendored CRD is booth-core's at CORE_REF
        run: diff -u booth-core/charts/booth-core/crds/booth.projectbooth.io_boothmodules.yaml test/integration/fixtures/boothmodule-crd.yaml

      - name: Build and load booth-core and booth-spark images, and the pinned Spark image
        run: |
          # dependency build (not update) installs exactly what core's Chart.lock pins.
          helm repo add nats https://nats-io.github.io/k8s/helm/charts/
          helm dependency build booth-core/charts/booth-core
          docker build -t booth-core:ci booth-core
          docker build -t booth-spark:ci .
          docker buildx imagetools inspect "$SPARK_INDEX" \
            --format '{{range .Manifest.Manifests}}{{.Digest}} {{if .Platform}}{{.Platform.Architecture}}{{end}}{{"\n"}}{{end}}' \
            | grep -qx "${SPARK_IMAGE_AMD64#*@} amd64" \
            || { echo "$SPARK_IMAGE_AMD64 is not the linux/amd64 entry of $SPARK_INDEX"; exit 1; }
          docker pull "$SPARK_IMAGE_AMD64"
          docker tag "$SPARK_IMAGE_AMD64" booth-spark-runtime:ci
          kind load docker-image booth-core:ci booth-spark:ci booth-spark-runtime:ci --name booth-spark-realcore

      - name: Deploy Keycloak, booth-core and booth-spark (runs on the pinned Spark image)
        id: deploy
        run: test/integration/deploy-realcore.sh booth-core booth-core:ci booth-spark:ci booth-spark-runtime:ci

      - name: Verify (including the REAL_CORE checks)
        env:
          REAL_CORE: "1"
        run: test/integration/verify.sh

      - name: "Identity (docs/design-v0.md item 2): /v1 with real Keycloak and workload tokens, the iframe path with core's real assertion"
        run: test/integration/identity.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: test/integration/browser/package-lock.json

      - name: Install Chromium for the browser checks
        run: cd test/integration/browser && npm ci && npx playwright install --with-deps chromium

      # The step 3 checks below each run even when an earlier one failed (the job still fails), so
      # one run reports on all of them; uninstall.sh runs last because it removes booth-spark.
      - name: "Runs (docs/design-v0.md items 3, 6, 7): an application with real executors in its own namespace, roles, failure, stop, admission"
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: test/integration/runs.sh

      - name: "Sessions (step 4): statements, visibility, idle shutdown, lifetime, delete, a backend restart mid-statement, orphan reaping"
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: test/integration/sessions.sh

      - name: "Isolation (item 3): run A and session E against session B, the run-pods policy, the driver ports, the backend's fence, the executor account"
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: test/integration/isolation.sh

      - name: "The Spark UI path (item 5): a real run's UI through core, submitter only, allowlist, Chromium"
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: test/integration/ui-path.sh

      - name: "Egress (ADR 0110): open is the internet only; closed is not even that"
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: test/integration/egress.sh booth-spark:ci booth-spark-runtime:ci

      - name: "Uninstall (ADR 0110 ruling 2): helm uninstall, and booth-core's module uninstall, leave nothing behind"
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: test/integration/uninstall.sh booth-spark:ci booth-spark-runtime:ci

      - name: Dump state on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n booth-system logs deployment/booth-core --tail=150 || true
          kubectl get boothmodules -A -o yaml || true
          kubectl -n booth-spark get secrets || true
          kubectl -n booth-spark describe pods | tail -60
          kubectl -n booth-spark logs deployment/booth-spark --tail=200 || true
          kubectl -n keycloak logs deploy/keycloak --tail=60 || true
          kubectl get namespaces -l booth.projectbooth.io/spark-run --show-labels || true
          for n in $(kubectl get namespaces -l booth.projectbooth.io/spark-run -o name | cut -d/ -f2); do
            kubectl -n "$n" get pods,networkpolicies,resourcequotas -o wide || true
            kubectl -n "$n" describe pod driver | tail -30 || true
            kubectl -n "$n" logs driver --tail=80 || true
            kubectl -n "$n" get events --sort-by=.lastTimestamp | tail -20 || true
          done
          kubectl get validatingadmissionpolicies,validatingadmissionpolicybindings || true
