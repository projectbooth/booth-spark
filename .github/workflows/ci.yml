name: CI

# Layers 1-2 (contracts/testing-strategy.md, ADR 0024): unit + contract tests, on every push and PR.
# No cluster, but the database tests run against a real PostgreSQL container
# (hack/docker-compose.emulators.yml, the same file used locally), and the identity tests against a
# real (in-process) OIDC provider and JWKS. Branch protection on main requires every job here.
# Runners pinned to a named release, not ubuntu-latest (ADR 0099); test/contract checks it.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Authenticated pulls get a much higher Docker Hub rate limit than anonymous ones -- docker
      # compose pulls postgres from docker.io. Guarded so forks and Dependabot (neither receives these
      # org secrets) are skipped rather than failing. Copied from booth-core (its PR #11).
      - uses: docker/login-action@v3
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: azure/setup-helm@v4 # test/contract renders the chart with `helm template`

      - name: Verify gofmt
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: Start PostgreSQL
        run: docker compose -f hack/docker-compose.emulators.yml up -d --wait

      - name: Unit + contract tests
        env:
          # A missing database must fail the build, never silently skip its tests green.
          BOOTH_TEST_REQUIRE_EMULATORS: "1"
          BOOTH_TEST_OPENAPI_OUT: ${{ runner.temp }}/openapi.yaml
        run: |
          eval "$(sh hack/test-env.sh)"
          go test -race -count=1 ./...

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # @redocly/cli 2.x needs >=20.19 or >=22.12

      # The /v1 interface's OpenAPI 3.1 document (internal/api/openapi/v1.yaml, written out by
      # TestOpenAPI_MatchesTheRoutes) must pass a real OpenAPI linter, as booth-api's does.
      - name: Lint the OpenAPI document
        run: |
          test -s "${{ runner.temp }}/openapi.yaml"
          npx -y @redocly/cli@2.53.3 lint "${{ runner.temp }}/openapi.yaml" --config hack/redocly.yaml

      - name: Database logs on failure
        if: failure()
        run: docker compose -f hack/docker-compose.emulators.yml logs --tail=100

  helm-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - name: helm lint (default, own-database and full-identity values)
        working-directory: charts/booth-spark
        run: |
          helm lint .
          helm lint . --set postgres.provisionedByCore=false --set postgres.dsnSecret.name=my-db
          helm lint . --set oidc.issuerUrl=https://idp.example/realms/booth --set oidc.clientId=booth-design \
            --set oidc.jwksUrl=http://keycloak.keycloak.svc:8080/realms/booth/protocol/openid-connect/certs \
            --set oidc.workloadIssuerUrl=http://booth-core.booth-system.svc:8080 --set submit.minRole=owner

  image:
    # Catches a broken Dockerfile on the PR that breaks it, not at release time. Not pushed.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && github.actor != 'dependabot[bot]'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: docker build
        run: docker build -t booth-spark:ci .
