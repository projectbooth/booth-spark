{{- if .Values.serviceAccount.create }}
# The backend's own account: exactly the fenced rights in rbac.yaml (docs/design-v0.md item 3),
# pinned by TestChart_RBACIsExactlyTheDesign.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "booth-spark.serviceAccountName" . }}
  labels:
    {{- include "booth-spark.labels" . | nindent 4 }}
{{- end }}
