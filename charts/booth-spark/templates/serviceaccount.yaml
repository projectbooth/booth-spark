{{- if .Values.serviceAccount.create }}
# The backend's own account. In this first step it holds no Kubernetes API rights at all (and the
# pod doesn't mount its token); step 3 adds exactly the fenced rights docs/design-v0.md item 3
# describes, pinned by an exact-rules chart test.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "booth-spark.serviceAccountName" . }}
  labels:
    {{- include "booth-spark.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
