apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "booth-spark.fullname" . }}
  labels:
    {{- include "booth-spark.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "booth-spark.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "booth-spark.selectorLabels" . | nindent 8 }}
        booth.projectbooth.io/module: spark
    spec:
      serviceAccountName: {{ include "booth-spark.serviceAccountName" . }}
      # The backend creates and removes run namespaces with exactly the fenced rights in rbac.yaml.
      automountServiceAccountToken: true
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: booth-spark
          image: {{ include "booth-spark.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.dataAccess.enabled }}
            # The internal port: this install's run namespaces only (networkpolicy.yaml), never
            # through booth-core.
            - name: internal
              containerPort: 8081
            {{- end }}
          env:
            - name: BOOTH_HTTP_ADDR
              value: ":8080"
            - name: BOOTH_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "booth-spark.dsnSecretName" . }}
                  key: {{ .Values.postgres.dsnSecret.key }}
            - name: BOOTH_IFRAME_IDENTITY_ISSUER_URL
              value: {{ required "identity.issuerUrl is required: the module's UI is authenticated by booth-core's X-Booth-Identity assertion (ADR 0069)" .Values.identity.issuerUrl | quote }}
            - name: BOOTH_OIDC_GROUPS_CLAIM
              value: {{ .Values.oidc.groupsClaim | quote }}
            - name: BOOTH_SUBMIT_MIN_ROLE
              value: {{ .Values.submit.minRole | quote }}
            {{- with .Values.oidc.issuerUrl }}
            - name: BOOTH_OIDC_ISSUER_URL
              value: {{ . | quote }}
            - name: BOOTH_OIDC_CLIENT_ID
              value: {{ $.Values.oidc.clientId | quote }}
            - name: BOOTH_OIDC_REQUIRE_AUDIENCE
              value: {{ $.Values.oidc.requireAudience | quote }}
            {{- end }}
            {{- with .Values.oidc.jwksUrl }}
            # ADR 0108 key-fetch override. Rendered even without issuerUrl, so that mistake fails at
            # startup with a clear message instead of being silently ignored.
            - name: BOOTH_OIDC_JWKS_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.oidc.workloadIssuerUrl }}
            # ADR 0056/0059: booth-core's workload tokens on /v1. Also rendered without issuerUrl, so
            # that mistake fails at startup.
            - name: BOOTH_WORKLOAD_ISSUER_URL
              value: {{ . | quote }}
            {{- end }}
            # The run controller (values.yaml runs; docs/design-v0.md item 3).
            - name: BOOTH_RUNS
              value: {{ toJson .Values.runs | quote }}
            - name: BOOTH_SESSION_IDLE_TIMEOUT
              value: {{ .Values.sessions.idleTimeout | quote }}
            - name: BOOTH_SESSION_MAX_LIFETIME
              value: {{ .Values.sessions.maxLifetime | quote }}
            - name: BOOTH_SESSION_RESULT_RETENTION
              value: {{ .Values.sessions.resultRetention | quote }}
            {{- if .Values.dataAccess.enabled }}
            # Data access (values.yaml dataAccess; docs/design-v0.md item 4).
            - name: BOOTH_DATA_ACCESS
              value: {{ toJson .Values.dataAccess | quote }}
            - name: BOOTH_WORKLOAD_MINT_URL
              valueFrom:
                secretKeyRef: {name: booth-workload-minting-credentials, key: url}
            - name: BOOTH_WORKLOAD_MINT_CREDENTIAL
              valueFrom:
                secretKeyRef: {name: booth-workload-minting-credentials, key: credential}
            - name: BOOTH_AGENT_IMAGE
              value: {{ include "booth-spark.image" . | quote }}
            - name: BOOTH_INTERNAL_ADDR
              value: ":8081"
            - name: BOOTH_INTERNAL_URL
              value: {{ include "booth-spark.internalUrl" . | quote }}
            {{- end }}
            - name: BOOTH_INSTANCE
              value: {{ include "booth-spark.instance" . | quote }}
            - name: BOOTH_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: BOOTH_SERVICE_ACCOUNT
              value: {{ include "booth-spark.serviceAccountName" . | quote }}
            - name: BOOTH_BACKEND_POD_LABELS
              value: {{ include "booth-spark.selectorLabels" . | fromYaml | toJson | quote }}
            - name: BOOTH_DRIVER_CLUSTERROLE
              value: "{{ include "booth-spark.fullname" . }}-driver"
            - name: BOOTH_RUN_CONTROLLER_CLUSTERROLE
              value: "{{ include "booth-spark.fullname" . }}-run-controller"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
