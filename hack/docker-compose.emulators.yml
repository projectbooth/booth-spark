# Local stand-in for the one external service booth-spark's tests talk to. CI runs the same image
# (see .github/workflows/ci.yml), so a green local run means the same thing a green CI run does. Not
# used at runtime; test tooling only.
#
#   docker compose -f hack/docker-compose.emulators.yml up -d --wait
#   eval "$(sh hack/test-env.sh)"        # export the BOOTH_TEST_* variables (bash/zsh)
#   go test ./...
#   docker compose -f hack/docker-compose.emulators.yml down -v
#
# Port 15444 so this can run alongside the other booth-* repos' test databases (storage 15432,
# catalog 15433, pipeline 15434, streamlit 15436, others 15442-15443). An explicit project name,
# because every booth-* repo keeps this file in a directory called "hack". The image is pinned by
# digest (postgres:16-alpine, resolved 2026-10-09).
name: booth-spark-test

services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: booth
      POSTGRES_PASSWORD: booth-test
      POSTGRES_DB: booth_spark_test
    ports: ["15444:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booth -d booth_spark_test"]
      interval: 2s
      timeout: 5s
      retries: 30
