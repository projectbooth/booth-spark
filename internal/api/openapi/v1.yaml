openapi: 3.1.0
info:
  title: booth-spark job-submission API
  version: "1.0.0"
  summary: Submit and manage Spark applications on Project Booth.
  description: |
    The published interface of booth-spark (docs/design-v0.md item 6). Reached through booth-core's
    gateway at `/modules/spark/v1/...` with a bearer token and the `X-Workspace` header: a person's
    OIDC token, or booth-core's workload token for an unattended caller such as a pipeline task
    (ADR 0059).

    Versioning: within v1, changes are additive only (new optional fields, new endpoints).
    Anything breaking is `/v2`, served alongside `/v1` for at least one minor release.

    Who may do what (docs/design-v0.md item 3): anyone in the workspace sees its runs; submitting
    needs `submit.minRole` (editor by default, owner allowed; never viewer); stopping a run or
    reading its logs needs its submitter (any token with the submission's subject), a workspace
    owner or a platform operator. `Idempotency-Key` is scoped to the workspace and that subject. A run's Spark UI
    opens in the shell for its submitter only (`uiPath`), and never for a run a workload submitted.

    Sessions are their submitter's and their workspace owners': nobody else sees them, and only the
    submitter runs statements in one. A session with nothing waiting or running and no new
    statement for its idle timeout is stopped, as is every session after its maximum lifetime.

    Data access (docs/design-v0.md item 4): a run or session may read and write the workspace's
    booth-database schema, its booth-lakehouse warehouse (the Iceberg catalog `lakehouse`) and up to
    4 booth-storage locations, as its submitter, capped at editor; and an application may start from
    a Python file or a JAR in booth-storage. Each path answers 422 on an install that doesn't offer
    it (the chart's dataAccess). A run submitted with a workload token gets data access only when
    booth-core's signed `booth_module` claim names the pipeline module and the token carries core's
    signed `booth_owner` claim (ADR 0119; its subject must also be `pipeline:<workspace>:<run>`): the run then reads and writes as that owner (`dataOwner`), capped
    at the lesser of editor and the token's role (`dataCeiling`), fixed at submit. Any other
    workload token gets 422 (ADR 0110 ruling 5), and so does every workload token for a session.
    The request never names an owner. A run whose submitter, or owner, loses access fails, and its
    namespace is deleted.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: /modules/spark/v1
    description: Through booth-core's gateway
security:
  - bearer: []
tags:
  - name: identity
    description: Who the caller is, as this module derives it
  - name: applications
    description: Batch Spark applications, one namespace per run
  - name: sessions
    description: Long-lived Spark sessions that take statements, one namespace each; stopped when idle
  - name: cluster
    description: What runs share on this install, read-only
paths:
  /me:
    get:
      tags: [identity]
      operationId: getMe
      summary: The caller, as booth-spark derived it from the verified token
      parameters:
        - $ref: "#/components/parameters/Workspace"
      responses:
        "200":
          description: The caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /limits:
    get:
      tags: [identity]
      operationId: getLimits
      summary: What this caller may request, so a client doesn't guess
      description: |
        The install's limits (the same ones the module's own page shows) and whether this caller may
        submit. Any caller with a role in the workspace gets 200, workload tokens included; a client
        may read the 200 as "booth-spark is installed for this workspace".
      parameters:
        - $ref: "#/components/parameters/Workspace"
      responses:
        "200":
          description: The limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Limits"
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /cluster:
    get:
      tags: [cluster]
      operationId: getCluster
      summary: What Spark runs on in this install, and how much of it the live runs hold
      description: |
        Read-only. There is no standing Spark cluster: each run gets its own driver pod, which asks
        Kubernetes for its executors in the run's own namespace, and both end with the run. What
        runs share is the install's admission bounds (runs.maxRunning, runs.maxRunningPerWorkspace,
        runs.memoryBudget): this shows them, what the pending and running runs hold of them on the
        whole install and in this workspace, and the shape of a run's pods. Which runs are live is
        `GET /applications` and `GET /sessions`, with their own visibility; other workspaces' runs
        are only counted. Any caller with a role in the workspace gets 200.
      parameters:
        - $ref: "#/components/parameters/Workspace"
      responses:
        "200":
          description: The cluster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cluster"
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "503": {$ref: "#/components/responses/Error"}
  /applications:
    get:
      tags: [applications]
      operationId: listApplications
      summary: The workspace's runs, newest first (at most 200)
      parameters:
        - $ref: "#/components/parameters/Workspace"
        - name: state
          in: query
          required: false
          description: Only runs in this state
          schema: {$ref: "#/components/schemas/State"}
        - name: mine
          in: query
          required: false
          description: Only the caller's own runs
          schema: {type: boolean}
        - name: limit
          in: query
          required: false
          description: |
            At most this many runs (default 200), newest first, after the filters. `more` says
            whether there are others among the workspace's 200 newest.
          schema: {type: integer, minimum: 1, maximum: 200}
      responses:
        "200":
          description: The runs
          content:
            application/json:
              schema:
                type: object
                required: [applications]
                properties:
                  applications:
                    type: array
                    items: {$ref: "#/components/schemas/Run"}
                  more:
                    type: boolean
                    description: More runs match than `limit` let through
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
    post:
      tags: [applications]
      operationId: submitApplication
      summary: Submit an application
      description: |
        Admission is checked first: at most `runs.maxRunning` live runs install-wide (and
        `runs.maxRunningPerWorkspace` per workspace), and every live run's largest footprint must
        fit `runs.memoryBudget`; otherwise 429.
      parameters:
        - $ref: "#/components/parameters/Workspace"
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            A caller-chosen key (at most 200 characters). Submitting again with the same key, by the
            same caller in the same workspace, returns the first run (200) instead of starting another.
          schema: {type: string, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ApplicationSpec"}
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "200":
          description: Already submitted with this Idempotency-Key
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /applications/{id}:
    get:
      tags: [applications]
      operationId: getApplication
      summary: One run
      parameters:
        - $ref: "#/components/parameters/Workspace"
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: The run
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /applications/{id}/stop:
    post:
      tags: [applications]
      operationId: stopApplication
      summary: Stop a run (its submitter, a workspace owner or a platform operator)
      parameters:
        - $ref: "#/components/parameters/Workspace"
        - $ref: "#/components/parameters/RunID"
      responses:
        "202":
          description: Stop requested; the run becomes `stopped` and its namespace is deleted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "200":
          description: The run had already ended
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Run"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /applications/{id}/logs:
    get:
      tags: [applications]
      operationId: getApplicationLogs
      summary: The driver's log (its submitter, a workspace owner or a platform operator)
      description: |
        Live while the run is live; afterwards, the last 1 MiB kept when it ended, until
        sessions.resultRetention after that (then 410 cleared).

        With `from`, a cursor: the log from that byte offset of the driver's whole log, at most
        1 MiB, with the offset to ask for next in `X-Log-Offset`. Offsets mean the same while the
        run lives and after it ends, so a caller polls with the last `X-Log-Offset` until
        `X-Log-Complete: true`. After the end only the kept tail is left: asking for an offset
        before it returns the tail, and `X-Log-Skipped` says how many bytes are gone. A full
        piece ends at a line's end; no piece ends inside a character; a byte that isn't UTF-8 is
        shown as `?`. An offset beyond the log's end is 400.
      parameters:
        - $ref: "#/components/parameters/Workspace"
        - $ref: "#/components/parameters/RunID"
        - name: tail
          in: query
          required: false
          description: Lines from the end of a live log (default 500). Not with from.
          schema: {type: integer, minimum: 1, maximum: 10000}
        - name: from
          in: query
          required: false
          description: A byte offset in the driver's whole log (0, or a previous X-Log-Offset)
          schema: {type: integer, minimum: 0, format: int64}
      responses:
        "200":
          description: The log, or with from, the next piece of it
          headers:
            X-Log-Offset:
              description: With from, the offset to ask for next
              schema: {type: integer, format: int64}
            X-Log-Complete:
              description: With from, "true" once the run has ended and this piece reaches its log's end
              schema: {type: string, enum: ["true"]}
            X-Log-Skipped:
              description: With from, after the run ended, how many bytes before the kept tail are gone
              schema: {type: integer, format: int64}
          content:
            text/plain:
              schema: {type: string}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "410": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /applications/{id}/spec:
    get:
      tags: [applications]
      operationId: getApplicationSpec
      summary: A run's spec, to submit again (its submitter, a workspace owner or a platform operator)
      description: |
        The run's spec as `POST /applications` takes it, with its inline code and arguments, for
        submitting a new run with the same settings ("Run again"); the run itself never changes.
        Once sessions.resultRetention has cleared the run's inline code, `codeCleared` is true and
        the spec has no code.
      parameters:
        - $ref: "#/components/parameters/Workspace"
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: The run's spec
          content:
            application/json:
              schema:
                type: object
                required: [spec, codeCleared]
                properties:
                  spec: {$ref: "#/components/schemas/ApplicationSpec"}
                  codeCleared:
                    type: boolean
                    description: The run's inline code was cleared by sessions.resultRetention
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /sessions:
    get:
      tags: [sessions]
      operationId: listSessions
      summary: The caller's sessions (all of the workspace's, for a workspace owner), newest first
      parameters:
        - $ref: "#/components/parameters/Workspace"
      responses:
        "200":
          description: The sessions
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: {$ref: "#/components/schemas/Session"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
    post:
      tags: [sessions]
      operationId: startSession
      summary: Start a session
      description: |
        Admitted like an application (runs.maxRunning, runs.memoryBudget; otherwise 429). The session
        becomes `running` once its SparkSession is ready; statements sent before then wait.
      parameters:
        - $ref: "#/components/parameters/Workspace"
        - name: Idempotency-Key
          in: header
          required: false
          description: As for applications
          schema: {type: string, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SessionSpec"}
      responses:
        "201":
          description: Started
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "200":
          description: Already started with this Idempotency-Key
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "422": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /sessions/{id}:
    get:
      tags: [sessions]
      operationId: getSession
      summary: One session (its submitter or a workspace owner)
      parameters:
        - $ref: "#/components/parameters/Workspace"
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    delete:
      tags: [sessions]
      operationId: deleteSession
      summary: Stop a session and delete its namespace (its submitter or a workspace owner)
      parameters:
        - $ref: "#/components/parameters/Workspace"
        - $ref: "#/components/parameters/RunID"
      responses:
        "202":
          description: Stop requested; the session becomes `stopped` and its namespace is deleted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "200":
          description: The session had already ended
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Session"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
  /sessions/{id}/logs:
    get:
      tags: [sessions]
      operationId: getSessionLogs
      summary: The session driver's log (its submitter or a workspace owner)
      parameters:
        - $ref: "#/components/parameters/Workspace"
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: The log
          content:
            text/plain:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "410": {$ref: "#/components/responses/Error"}
        "502": {$ref: "#/components/responses/Error"}
  /sessions/{id}/statements:
    get:
      tags: [sessions]
      operationId: listStatements
      summary: The session's statements, in order (its submitter or a workspace owner)
      parameters:
        - $ref: "#/components/parameters/Workspace"
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: The statements
          content:
            application/json:
              schema:
                type: object
                required: [statements]
                properties:
                  statements:
                    type: array
                    items: {$ref: "#/components/schemas/Statement"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
    post:
      tags: [sessions]
      operationId: runStatement
      summary: Run a statement in the session (its submitter only)
      description: |
        Statements run one at a time, in order, in the session's one SparkSession (`spark`, `sc`).
        A statement that fails ends as `error` with its traceback; the session goes on. At most 20
        statements may be waiting or running at once (429). A statement waiting or running keeps
        the session from going idle.
      parameters:
        - $ref: "#/components/parameters/Workspace"
        - $ref: "#/components/parameters/RunID"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StatementRequest"}
      responses:
        "201":
          description: Queued
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Statement"}
        "400": {$ref: "#/components/responses/Error"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
        "409": {$ref: "#/components/responses/Error"}
        "429": {$ref: "#/components/responses/Error"}
  /sessions/{id}/statements/{sid}:
    get:
      tags: [sessions]
      operationId: getStatement
      summary: One statement, with its output once it has ended
      parameters:
        - $ref: "#/components/parameters/Workspace"
        - $ref: "#/components/parameters/RunID"
        - name: sid
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The statement
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Statement"}
        "401": {$ref: "#/components/responses/Error"}
        "403": {$ref: "#/components/responses/Error"}
        "404": {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Workspace:
      name: X-Workspace
      in: header
      required: true
      description: The active workspace's slug (booth-core forwards it as X-Booth-Workspace)
      schema: {type: string}
    RunID:
      name: id
      in: path
      required: true
      schema: {type: string, pattern: "^r[a-z0-9]{11}$"}
  responses:
    Error:
      description: An error
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: {type: string, description: "What went wrong, in words"}
        code:
          type: string
          description: A stable machine-readable code
          enum: [invalid, forbidden, not_found, unavailable, at_capacity, session_over, cleared, internal]
    Me:
      type: object
      required: [subject, workspace, role, operator, workload, canSubmit, submitMinRole]
      properties:
        subject: {type: string}
        displayName: {type: string}
        workspace: {type: string}
        role: {type: string, enum: [owner, editor, viewer]}
        operator: {type: boolean}
        workload: {type: boolean}
        canSubmit: {type: boolean}
        submitMinRole: {type: string, enum: [editor, owner]}
    Limits:
      type: object
      required: [maxExecutors, defaultExecutors, driverMemory, executorMemory, maxMemory, maxDuration,
        sessionIdleTimeout, sessionMaxLifetime, dataAccess, role, canSubmit, submitMinRole, maxStorageLocations,
        languages, entryPoints]
      properties:
        maxExecutors: {type: integer, description: The most executors one run may scale to}
        defaultExecutors: {type: integer, description: Executors when a run asks for none}
        driverMemory: {type: string, description: "The driver's heap when a run asks for none (e.g. 512m)"}
        executorMemory: {type: string, description: "Each executor's heap when a run asks for none"}
        maxMemory: {type: string, description: "The largest heap a run may ask for, driver or executor (e.g. 2g)"}
        maxDuration: {type: string, description: "The longest a run may live, as a Go duration (e.g. 6h0m0s); a run's maxDuration may be at most this"}
        sessionIdleTimeout: {type: string, description: "A session's default idle timeout, as a Go duration"}
        sessionMaxLifetime: {type: string, description: "The longest any session lives, as a Go duration"}
        dataAccess:
          type: object
          description: Which data paths this install offers runs (dataAccess in a run's body)
          required: [database, lakehouse, storage]
          properties:
            database: {type: boolean}
            lakehouse: {type: boolean}
            storage: {type: boolean}
        role: {type: string, enum: [owner, editor, viewer], description: "The caller's role in the workspace"}
        canSubmit: {type: boolean, description: Whether this caller may submit applications and start sessions}
        submitMinRole: {type: string, enum: [editor, owner]}
        maxStorageLocations: {type: integer, description: The most storage locations one run may name}
        languages:
          type: array
          items: {type: string, enum: [python, scala]}
          description: The languages runs may be written in on this install (scala where runs.scala.enabled)
        entryPoints:
          type: array
          items: {type: string, enum: [inlinePython, inlineScala, python, scala, jar]}
          description: The main fields an application may use (the file ones only with booth-storage)
    PodShape:
      type: object
      required: [defaultMemory, cpuRequest, cpuLimit]
      properties:
        defaultMemory: {type: string, description: "The heap when a run asks for none (e.g. 512m)"}
        cpuRequest: {type: string, description: "The pod's CPU request (Kubernetes quantity)"}
        cpuLimit: {type: string, description: "The pod's CPU limit (Kubernetes quantity)"}
        cores: {type: integer, description: "Executors only: Spark's task slots per executor (spark.executor.cores)"}
        maxPerRun: {type: integer, description: "Executors only: the most one run may scale to"}
    Cluster:
      type: object
      required: [master, driver, executor, capacity]
      properties:
        master: {type: string, enum: [kubernetes], description: "Spark's cluster manager"}
        driver: {$ref: "#/components/schemas/PodShape"}
        executor: {$ref: "#/components/schemas/PodShape"}
        capacity:
          type: object
          required: [maxRunning, liveRuns, maxRunningPerWorkspace, liveRunsInWorkspace, memoryBudgetMi, memoryInUseMi, memoryInUseInWorkspaceMi]
          properties:
            maxRunning: {type: integer, description: "The most pending or running runs on the install (runs.maxRunning)"}
            liveRuns: {type: integer, description: "Pending or running runs on the install, every workspace's"}
            maxRunningPerWorkspace: {type: integer, description: "The most in one workspace (runs.maxRunningPerWorkspace); 0 for no cap"}
            liveRunsInWorkspace: {type: integer, description: "Pending or running runs in this workspace, sessions the caller can't see included"}
            memoryBudgetMi: {type: integer, description: "The memory all live runs' pods may hold at once, MiB (runs.memoryBudget)"}
            memoryInUseMi: {type: integer, description: "What the live runs hold of it: the sum of their footprintMi"}
            memoryInUseInWorkspaceMi: {type: integer, description: "The same, for this workspace's runs"}
    Origin:
      type: object
      description: |
        What started the run, from what booth-spark records at submit. `person`: someone's own
        token, through the module's page or this API. `pipeline`: a pipeline task (ADR 0119), only
        when core's signed booth_module claim named the pipeline module (recorded at submit; for a
        run recorded before that, only with a data owner, which needed the same claim);
        `pipelineRun` is from its subject, and `task` and `attempt` from the Idempotency-Key
        booth-pipeline sends (`<run>/<taskKey>/<attempt>`) when it names the same run. `workload`:
        any other workload token, `workload` being its subject's kind as the minting module chose it.
        `module` is the module core signed into the token (its `booth_module` claim), recorded at
        submit; absent for a person's run and for runs recorded before it was kept.
      required: [kind]
      properties:
        kind: {type: string, enum: [person, pipeline, workload]}
        module: {type: string}
        workload: {type: string}
        pipelineRun: {type: string}
        task: {type: string}
        attempt: {type: string}
    State:
      type: string
      enum: [pending, running, succeeded, failed, stopped]
    ApplicationSpec:
      type: object
      additionalProperties: false
      required: [name, main]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9 ._-]{0,99}$"
        main:
          type: object
          additionalProperties: false
          properties:
            inlinePython:
              type: string
              maxLength: 262144
              description: The application's Python source (PySpark), at most 256 KiB
            inlineScala:
              type: string
              maxLength: 262144
              description: |
                The application's Scala source, at most 256 KiB, where the install offers Scala
                (limits.languages has scala; otherwise 422). Run by the runtime image's Scala runner
                statement by statement, as spark-shell runs separate lines: spark, sc, args, booth and
                spark-shell's imports are defined; the first statement that doesn't compile or throws
                ends the run failed (docs/operations.md, "Scala").
            python:
              $ref: "#/components/schemas/FileRef"
              description: A .py file in booth-storage, read as the submitter when the run starts
            scala:
              $ref: "#/components/schemas/FileRef"
              description: A .scala file in booth-storage, read as the submitter when the run starts and run as inlineScala is
            jar:
              $ref: "#/components/schemas/FileRef"
              description: A .jar file in booth-storage, read as the submitter when the run starts
            mainClass:
              type: string
              maxLength: 256
              description: The JAR's fully qualified main class (with main.jar only)
            inlinePythonBytes: {type: integer, description: Set by the module; ignored on submission}
            inlinePythonSha256: {type: string, description: Set by the module; ignored on submission}
            inlineScalaBytes: {type: integer, description: Set by the module; ignored on submission}
            inlineScalaSha256: {type: string, description: Set by the module; ignored on submission}
          description: Exactly one of inlinePython, inlineScala, python, scala or jar
        args:
          type: array
          maxItems: 64
          items: {type: string, maxLength: 4096}
        resources:
          type: object
          additionalProperties: false
          properties:
            driver:
              type: object
              additionalProperties: false
              properties:
                memory: {$ref: "#/components/schemas/Memory"}
            executors:
              type: object
              additionalProperties: false
              properties:
                min: {type: integer, minimum: 0}
                max: {type: integer, minimum: 0, description: "At most runs.maxExecutors"}
                memory: {$ref: "#/components/schemas/Memory"}
        conf:
          type: object
          description: |
            Spark settings the caller may set: spark.sql.shuffle.partitions, spark.default.parallelism,
            spark.sql.adaptive.enabled, spark.sql.session.timeZone, spark.sql.ansi.enabled,
            spark.sql.execution.arrow.pyspark.enabled. Anything else is refused (400).
          additionalProperties: {type: string, maxLength: 256}
        dataAccess: {$ref: "#/components/schemas/DataAccess"}
        maxDuration:
          type: string
          description: A Go duration (e.g. "30m"), at most runs.maxDuration, which is the default
    FileRef:
      type: object
      additionalProperties: false
      required: [backendId, path]
      properties:
        backendId: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$"}
        path: {type: string, maxLength: 1024, description: "Relative, no '..', '.' or empty segments"}
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: |
            Optional: the file's SHA-256 (64 lowercase hex characters). The run's start gate hashes
            the bytes it copies in and, on any other hash, never starts Spark: the run ends failed,
            "could not start: main.jar (booth-storage <backend>/<path>) has sha256 <actual>, not the
            <expected> the run asked for". Without it, the run reads whatever the file holds when it
            starts. Not accepted on inline code, which is pinned by being inline.
    DataAccess:
      type: object
      additionalProperties: false
      description: |
        What the run reads and writes, as its submitter capped at editor (a submitter demoted to
        viewer since gets read only). Resolved when the run starts: a location the submitter can't
        have, or a workspace with no warehouse, fails it with the reason.
      properties:
        database:
          type: boolean
          description: The workspace's booth-database schema, as DATABASE_URL and JDBC_DATABASE_URL in every pod
        lakehouse:
          type: boolean
          description: The workspace's lakehouse warehouse, as the Iceberg catalog `lakehouse`
        storage:
          type: array
          maxItems: 4
          description: booth-storage locations (s3a://, one per bucket in this version), as BOOTH_STORAGE in every pod
          items:
            type: object
            additionalProperties: false
            required: [backendId, path]
            properties:
              backendId: {type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$"}
              path: {type: string, maxLength: 1024}
              access: {type: string, enum: [read, readwrite], default: read}
    DataView:
      type: object
      description: A run's data access as asked and, once it started, as granted. No credential.
      properties:
        database: {type: boolean}
        lakehouse: {type: boolean}
        storage:
          type: array
          items:
            type: object
            properties:
              backendId: {type: string}
              path: {type: string}
              access: {type: string, enum: [read, readwrite]}
        role: {type: string, enum: [editor, viewer], description: "The run's token's role when it started: editor reads and writes, viewer reads"}
        warehouseRoot: {type: string, description: "s3:// root of the warehouse"}
        storageRoots: {type: array, items: {type: string}, description: "s3a:// root of each storage location, in order"}
    Memory:
      type: string
      pattern: "^[1-9][0-9]{0,5}[mg]$"
      description: A JVM heap in Spark's notation, between 512m and runs.maxMemory
    Run:
      type: object
      required: [id, kind, workspace, submitter, workload, name, state, stopRequested, createdAt, footprintMi, resources, origin]
      properties:
        id: {type: string}
        kind: {type: string, enum: [application]}
        workspace: {type: string}
        submitter: {type: string, description: The submitter's subject}
        submitterName: {type: string}
        workload: {type: boolean, description: Submitted with a workload token}
        name: {type: string}
        state: {$ref: "#/components/schemas/State"}
        reason: {type: string, description: "Why the run is in its state, once it has ended"}
        waitingReason:
          type: string
          description: |
            While the run is pending: why it is still waiting at launch (resolving its data access,
            its driver not yet scheduled), in the backend's words. Absent once it starts or ends.
        stopRequested: {type: boolean}
        createdAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        contentClearedAt: {type: string, format: date-time, description: "When its content (log tail; a session's statement code, output and error) was cleared, sessions.resultRetention after it ended"}
        footprintMi: {type: integer, description: "The most memory the run's pods can use at once, MiB"}
        resources:
          type: object
          required: [driverMemory, executorMemory, minExecutors, maxExecutors, maxDuration]
          properties:
            driverMemory: {type: string}
            executorMemory: {type: string}
            minExecutors: {type: integer}
            maxExecutors: {type: integer}
            maxDuration: {type: string}
        uiPath:
          type: string
          description: "While running, where the run's Spark UI opens in the shell (its submitter only; never for a run a workload submitted)"
        dataOwner:
          type: string
          description: "For a run a pipeline submitted (ADR 0119): whom it reads and writes data as, the pipeline's owner from the token's signed booth_owner claim (a person's subject or svc:<workspace>:<name>). Absent for a person's run, which reads as its submitter"
        dataCeiling:
          type: string
          enum: [editor, viewer]
          description: "For a run a pipeline submitted: its token's role ceiling, the lesser of editor and the submitting token's role, fixed at submit"
        dataAccess: {$ref: "#/components/schemas/DataView"}
        origin: {$ref: "#/components/schemas/Origin"}
        main:
          type: object
          description: The run's entry point without its code
          properties:
            inlinePythonBytes: {type: integer, description: "The inline Python's length; kept after sessions.resultRetention clears the code"}
            inlinePythonSha256: {type: string, description: "The inline Python's SHA-256 (hex); kept after the code is cleared"}
            inlineScalaBytes: {type: integer, description: "The inline Scala's length; kept after sessions.resultRetention clears the code"}
            inlineScalaSha256: {type: string, description: "The inline Scala's SHA-256 (hex); kept after the code is cleared"}
            python: {$ref: "#/components/schemas/FileRef"}
            scala: {$ref: "#/components/schemas/FileRef"}
            jar: {$ref: "#/components/schemas/FileRef"}
            mainClass: {type: string}
    SessionSpec:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9 ._-]{0,99}$"
        resources:
          type: object
          additionalProperties: false
          properties:
            driver:
              type: object
              additionalProperties: false
              properties:
                memory: {$ref: "#/components/schemas/Memory"}
            executors:
              type: object
              additionalProperties: false
              properties:
                min: {type: integer, minimum: 0}
                max: {type: integer, minimum: 0}
                memory: {$ref: "#/components/schemas/Memory"}
        conf:
          type: object
          description: The same allowlist as an application's conf
          additionalProperties: {type: string, maxLength: 256}
        dataAccess: {$ref: "#/components/schemas/DataAccess"}
        idleTimeout:
          type: string
          description: "A Go duration, at most sessions.idleTimeout (the default)"
        maxLifetime:
          type: string
          description: "A Go duration, at most sessions.maxLifetime (the default)"
        language:
          type: string
          enum: [python, scala]
          description: |
            The session's flavour, fixed when it starts (default python). A python session runs
            statements of kind sql or python; a scala session (where limits.languages has scala,
            otherwise 422) runs sql or scala, in the runtime image's Scala runner: statements run in
            order in one interpreter, so what one defines the next can use. sql gives the same JSON in
            both.
    Session:
      type: object
      required: [id, kind, workspace, submitter, workload, name, state, stopRequested, createdAt, footprintMi, resources, idleTimeout, maxLifetime, language, origin]
      properties:
        origin: {$ref: "#/components/schemas/Origin"}
        id: {type: string}
        kind: {type: string, enum: [session]}
        workspace: {type: string}
        submitter: {type: string}
        submitterName: {type: string}
        workload: {type: boolean}
        name: {type: string}
        state: {$ref: "#/components/schemas/State"}
        reason: {type: string, description: "Why the session ended: deleted on request, idle, its maximum lifetime, or a failure"}
        stopRequested: {type: boolean}
        createdAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        contentClearedAt: {type: string, format: date-time, description: "When its content (log tail; a session's statement code, output and error) was cleared, sessions.resultRetention after it ended"}
        lastActivityAt: {type: string, format: date-time}
        footprintMi: {type: integer}
        idleTimeout: {type: string}
        maxLifetime: {type: string}
        language: {type: string, enum: [python, scala]}
        resources:
          type: object
          required: [driverMemory, executorMemory, minExecutors, maxExecutors]
          properties:
            driverMemory: {type: string}
            executorMemory: {type: string}
            minExecutors: {type: integer}
            maxExecutors: {type: integer}
        uiPath: {type: string, description: "While running, where the session's Spark UI opens in the shell (its submitter only)"}
        dataAccess: {$ref: "#/components/schemas/DataView"}
    StatementRequest:
      type: object
      additionalProperties: false
      required: [kind, code]
      properties:
        kind:
          type: string
          enum: [sql, python, scala]
          description: "sql in any session; python in a python session; scala in a scala session (otherwise 400)"
        code: {type: string, minLength: 1, maxLength: 262144}
    Statement:
      type: object
      required: [id, sessionId, seq, kind, code, state, createdAt]
      properties:
        id: {type: string}
        sessionId: {type: string}
        seq: {type: integer}
        kind: {type: string, enum: [sql, python, scala]}
        code: {type: string}
        state: {type: string, enum: [waiting, running, available, error, cancelled]}
        output:
          description: |
            Once available: for sql, {"type": "table", "columns": [{name, type}], "rows": [[...]],
            "truncated"} (at most 1000 rows and 1 MiB; the same JSON in either flavour); for python
            and scala, {"type": "text", "stdout", "stderr", "truncated"} (at most 1 MiB each; a scala
            statement's stdout also has the interpreter's echo of what it defined, as in spark-shell).
          type: object
        error: {type: string, description: "The traceback (python), the compiler's message or the exception (scala) of a statement that ended as error, or why it was cancelled"}
        createdAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
